openapi: 3.1.0
info:
  title: Homelab Decision API
  version: 1.5.0
  summary: Typed text decisions (Laya) and zero-shot image classification (SigLIP2) behind one contract.
  description: |
    A small proxy that fronts model backends on the `ml` VM:

    - **text** - Laya (`laya[serve]` 0.4.20) typed decisions: `choice`, `score`, `noul`.
    - **image** - SigLIP2 zero-shot classification
      (`google/siglip2-base-patch16-224`, commit `75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2`).

    The served models come from the proxy's backend registry and are listed by `GET /v1/models`.
    A request selects one with `model` (a model id from that list); without `model`, the
    registry's default model for the route's task serves it.

    `POST /v1/decisions` speaks the OpenAI Decisions API wire format instead (see that operation), and
    `POST /api/alpha/decisions` speaks the OpenRouter Decisions wire format (same path as OpenRouter, so
    OpenRouter SDKs work by changing only the base URL; it can also forward to paid OpenRouter models).
    Every other successful response is an `Envelope`. Every failure is an `ErrorEnvelope`
    (on `/api/alpha/*`: OpenRouter's `AlphaErrorEnvelope`) whose code maps to exactly one HTTP status:

    | code                  | HTTP |
    |-----------------------|------|
    | `invalid_request`     | 400  |
    | `unauthorized`        | 401  |
    | `forbidden`           | 403  |
    | `payload_too_large`   | 413  |
    | `rate_limited`        | 429  |
    | `internal_error`      | 500  |
    | `backend_error`       | 502  |
    | `backend_unavailable` | 503  |
    | `backend_timeout`     | 504  |

    Limits:

    - text `state`: at most 32 KiB (32768 bytes) once serialized as UTF-8 JSON (a string state
      counts its UTF-8 bytes); at most 32 questions per request.
    - image: at most 8 MiB (8388608 bytes) after base64 decoding; at most 64 candidate labels.

    Exceeding a size limit returns 413 `payload_too_large`; exceeding a count limit returns
    400 `invalid_request`.

    `error.type` (`invalid_request_error`, `authentication_error`, `server_error`) and `error.param`
    (the offending request field, or null) follow OpenAI's error object, so OpenAI SDK clients read
    our errors like theirs.

    Authentication:

    - The `/v1` API routes require a bearer API key (`Authorization: Bearer <api-key>`),
      except `GET /v1/health`, which is public.
    - `GET /healthz` is public.
    - `/admin` (key management, usage and audit) is not part of this contract. It uses its own
      session sign-in and is documented in `admin-api.yaml`.

    Missing, malformed, unknown, expired and revoked keys all return the same 401 `unauthorized`
    with the same generic message, so a caller cannot tell which case applied.
servers:
  - url: https://decide.ai.huynle.com
    description: Production (k3s, Traefik, API keys).
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "8080"
        description: Port the decision API listens on.
security:
  - apiKey: []
tags:
  - name: text
  - name: image
  - name: decisions
  - name: ops
paths:
  /v1/decide/text:
    post:
      tags: [text]
      operationId: decideText
      summary: Answer typed questions about a text or JSON state (Laya).
      description: |
        Forwards to Laya `POST /predict`. Laya's `answers` become `results`; Laya's
        `routing` and `usage` objects are passed through under `meta.routing` and `meta.usage`
        (local filesystem fields such as `routing.repo` are stripped by the proxy).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextDecisionRequest"
            examples:
              support_ticket:
                summary: Real request (api/fixtures/laya-predict.request.json)
                value:
                  state:
                    from: user@acme.com
                    subject: "Duplicate charge on invoice #4411"
                    body: We were billed twice for March. Please refund it today or we will cancel.
                  questions:
                    department:
                      type: choice
                      instructions: Which department should handle this request?
                      criteria:
                        billing: invoices, payments, refunds
                        technical: bugs, outages, system errors
                        sales: pricing, new contracts
                        other: everything else
                    urgency:
                      type: score
                      instructions: How urgent is this request?
                      criteria: [not urgent, soon, critical deadline or blocking issue]
                    churn_risk:
                      type: noul
                      instructions: Does the user threaten to cancel or leave?
      responses:
        "200":
          description: Decisions for every question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextDecisionEnvelope"
              examples:
                support_ticket:
                  summary: Real Laya answer (api/fixtures/laya-predict.json), wrapped in the envelope
                  value:
                    model: laya-english
                    model_version: laya-serve-0.4.20
                    latency_ms: 575
                    results:
                      department:
                        type: choice
                        choice: billing
                        probabilities: {billing: 0.9801, technical: 0.008, sales: 0.0053, other: 0.0066}
                        confidence: 0.9141
                        answer_confidence: 0.9801
                        action: {act_probability: 1.0}
                      urgency:
                        type: score
                        score: 1.4386
                        legend: {"0": not urgent, "1": soon, "2": critical deadline or blocking issue}
                        probabilities: {"0": 0.104, "1": 0.3535, "2": 0.5426}
                        confidence: 0.1492
                        answer_confidence: 0.5426
                        action: {act_probability: 1.0}
                      churn_risk:
                        type: noul
                        noul: 0.8184
                        confidence: 0.8184
                        answer_confidence: 0.8184
                        action: {act_probability: 1.0}
                    meta:
                      backend_model: laya-rl-agent
                      usage:
                        input_tokens: 249
                        output_tokens: 0
                        state_tokens: 45
                        state_tokens_dropped: 0
                        truncated: false
                        truncated_questions: []
                      routing:
                        model: english
                        reason: English Latin text
                        detection:
                          script: latin
                          script_profile: {latin: 1.0}
                          language: en
                          is_english: true
                          language_undecided: false
                          diacritic_rate: 0.0
                          non_latin_fraction: 0.0
                          mixed_segment: null
                        workflow: null
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/BackendError"}
        "503": {$ref: "#/components/responses/BackendUnavailable"}
        "504": {$ref: "#/components/responses/BackendTimeout"}
  /v1/classify/image:
    post:
      tags: [image]
      operationId: classifyImage
      summary: Zero-shot classify an image against candidate labels (SigLIP2).
      description: |
        Follows the Hugging Face `zero-shot-image-classification` convention: `candidate_labels`,
        `hypothesis_template`, and a result list of `{label, score}` sorted by descending score.
        Each label is inserted into `hypothesis_template` before text encoding; `results[].label`
        is the original candidate label, not the filled template. Scores are a softmax over the
        candidate labels of `logit_scale * cosine(image, text)`, so they sum to ~1 across all
        candidates (before `top_k` truncation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageClassifyRequest"
            examples:
              dog:
                summary: Labels from api/fixtures/siglip-dog-results.json ("general" family); image bytes elided
                value:
                  image:
                    base64: /9j/4AAQSkZJRgABAQAAAQABAAD...
                    media_type: image/jpeg
                  candidate_labels: [dog, german shepherd, cat, wolf, bird, horse, person, receipt, document, landscape]
                  hypothesis_template: a photo of a {}
                  top_k: 3
      responses:
        "200":
          description: Labels sorted by descending score.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageClassifyEnvelope"
              examples:
                dog:
                  summary: Real SigLIP2 output (siglip-dog-results.json, cuda, full image, top 3); latency is the measured GPU e2e median
                  value:
                    model: siglip2-base-patch16-224
                    model_version: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
                    latency_ms: 64.5
                    results:
                      - {label: german shepherd, score: 0.9447}
                      - {label: dog, score: 0.0548}
                      - {label: wolf, score: 0.0002}
                    meta:
                      hypothesis_template: a photo of a {}
                      pad_to_square: false
                      device: cuda
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/BackendError"}
        "503": {$ref: "#/components/responses/BackendUnavailable"}
        "504": {$ref: "#/components/responses/BackendTimeout"}
  /v1/decisions:
    post:
      tags: [decisions]
      operationId: createDecision
      summary: OpenAI Decisions API compatible endpoint (Laya for text and JSON, SigLIP2 for one image).
      description: |
        Accepts the request body of OpenAI's `POST /v1/decisions`
        (https://developers.openai.com/api/reference/resources/decisions/methods/create) and returns
        OpenAI's `Decision` object, so the OpenAI SDK works with `base_url` set to
        `https://decide.ai.huynle.com/v1` (`client.decisions.create(...)`).

        - **Model.** `gpt-6-luna` means the default text model (Laya routes by script and language).
          Registry ids from `GET /v1/models` and Laya checkpoint names also work. Omitting `model` is
          allowed here and selects the default.
        - **Text, JSON and conversations go to Laya.** `predicate` becomes Laya `noul`, `choice` and
          `score` keep their meaning. A string `input` or one user message of text parts is sent as text;
          one user message holding a single `input_json` object is sent as a JSON state; anything else is
          rendered as a transcript, one line per item (`user: ...`, `function_call <call_id> <name>: ...`).
          Tool outputs must follow a call with the same `call_id`. More than 32 questions are split into
          several Laya calls.
        - **Images: text wins.** A request may hold at most one image, a base64 data URL (PNG or JPEG),
          in `input`. When the input also carries text or JSON evidence (non-blank text, `input_json`,
          tool calls or outputs, other messages), Laya answers from that evidence alone, the image is
          ignored, and the response has the header `X-Decision-Image: ignored`. Only an input that holds
          the image and nothing else goes to SigLIP2, and then every question must be `choice`: each one is
          a zero-shot classification over its choice values (`hypothesis_template` "a photo of a {}"),
          `confidence` is the top probability, and instructions are not seen. Hosted `http(s)` image
          URLs, more than one image and images in question instructions return 400.
        - **Limits.** 1 to 400 questions, 2 to 64 choices, 2 to 10 levels, instructions up to 2048
          characters, text input up to 32 KiB, one image up to 8 MiB decoded. A string and a boolean
          choice value with the same text cannot be told apart and return 400.
        - **Ignored.** `prompt_cache_key`, `prompt_cache_options` and `safety_identifier` are accepted and
          ignored; `usage` cache and reasoning counts are always 0.
        - **Answers.** In question order; `name` is echoed (null when unnamed). A question the backend did
          not answer comes back as `{"type": "refusal"}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionCreateRequest"
            examples:
              support_ticket:
                summary: The support ticket of /v1/decide/text in OpenAI's format
                value:
                  model: gpt-6-luna
                  input: We were billed twice for March. Please refund it today or we will cancel.
                  questions:
                    - type: choice
                      name: department
                      instructions: Which department should handle this request?
                      choices:
                        - {value: billing, description: "invoices, payments, refunds"}
                        - {value: technical, description: "bugs, outages, system errors"}
                        - {value: sales, description: "pricing, new contracts"}
                        - {value: other, description: everything else}
                    - type: score
                      name: urgency
                      instructions: How urgent is this request?
                      levels:
                        - {label: not urgent}
                        - {label: soon}
                        - {label: critical deadline or blocking issue}
                    - type: predicate
                      name: churn_risk
                      instructions: Does the user threaten to cancel or leave?
      responses:
        "200":
          description: One answer per question, in question order.
          headers:
            X-Decision-Image:
              description: "`ignored` when the request's image was ignored because text or JSON evidence came with it."
              schema: {type: string, enum: [ignored]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
              examples:
                support_ticket:
                  summary: The real Laya answer (api/fixtures/laya-predict.json) in OpenAI's format
                  value:
                    model: laya-english
                    answers:
                      - type: choice
                        name: department
                        choice: billing
                        probabilities:
                          - {value: billing, probability: 0.9801}
                          - {value: technical, probability: 0.008}
                          - {value: sales, probability: 0.0053}
                          - {value: other, probability: 0.0066}
                        confidence: 0.9141
                      - type: score
                        name: urgency
                        score: 1.4386
                        probabilities:
                          - {value: 0, label: not urgent, probability: 0.104}
                          - {value: 1, label: soon, probability: 0.3535}
                          - {value: 2, label: critical deadline or blocking issue, probability: 0.5426}
                        confidence: 0.1492
                      - {type: predicate, name: churn_risk, probability: 0.8184}
                    usage:
                      input_tokens: 249
                      input_tokens_details: {cached_tokens: 0, cache_write_tokens: 0}
                      output_tokens: 0
                      output_tokens_details: {reasoning_tokens: 0}
                      total_tokens: 249
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/BackendError"}
        "503": {$ref: "#/components/responses/BackendUnavailable"}
        "504": {$ref: "#/components/responses/BackendTimeout"}
  /api/alpha/decisions:
    post:
      tags: [decisions]
      operationId: createAlphaDecision
      security:
        - apiKey: []
      summary: Typed decisions in the OpenRouter Decisions wire format (local models or paid OpenRouter models).
      description: |
        The request and response shapes of OpenRouter's `POST /api/alpha/decisions`
        (`DecisionsRequest` / `DecisionsResponse`): `model`, `state` (string, object or array) and
        `questions` keyed by id (`noul`, `choice`, `score`, `box`), optional `assets`, `provider`,
        `session_id`, `trace`, `user`. Point an OpenRouter SDK at `https://decide.ai.huynle.com` to use it.

        - **Model (required).** A registry id or alias from `GET /v1/models`, or a Laya checkpoint name
          (`english`). An alias with `text`/`image` targets uses `image` when the request has
          `image_url`/`input_audio`/`video_url` parts, `assets` or box questions, `text` otherwise.
          Unknown names are 400 with the valid ids and aliases. `model` in the response is the registry
          id that served the request (never the upstream versioned id).
        - **Capabilities.** The resolved model must accept every image, audio, video part and box question
          in the request, else 400 (`model 'laya-english' does not accept images`). Laya accepts text only;
          the zero-shot image model accepts exactly one image as the whole state (an `image_url` part, an
          asset key, or the only item of a state array) with choice questions only.
        - **Paid models** (`paid: true`, OpenRouter): only API keys the owner allowed (admin page) may use
          them; others get 403 `forbidden` before any upstream call. Without a configured OpenRouter key
          they are 503 `backend_unavailable`.
        - **Forwarded to OpenRouter:** `state`, `questions`, `assets` and `provider` unchanged, with
          `model` replaced by the upstream model id. `session_id`, `trace` and `user` are accepted and
          never forwarded. OpenRouter's `answers`, `usage` (including `cost`), `id`, `provider` and
          `annotations` are returned as they come.
        - **Local models:** Laya gets `state` (an array of strings joined by newlines, any other array or
          object as compact JSON), instructions/criteria objects as compact JSON, choice criteria
          `null` as the option name, noul criteria folded into the instructions (`True if: ...`,
          `False if: ...`), and `Answer this question about the state.` when instructions are missing.
          Local limits: 32 KiB state (413), 2-64 choice options, 2-16 score levels, 2048-character
          instructions; more than 32 questions are split across Laya calls. `id` is
          `gen-dec-<unix seconds>-<20 alphanumerics>`, `provider` is `homelab`, `usage.cost` is 0.
        - **Images** go in as base64 `data:` URLs (PNG, JPEG, WebP; PNG/JPEG for local models) or as
          `assets` (every asset must be referenced in state, instructions or criteria, else 400 naming
          it). Hosted `http(s)` image URLs are 400. Body limit 16 MiB; at most 400 questions.
        - **Errors** use OpenRouter's envelope: `error.code` is the HTTP status, `error.metadata.code`
          the contract code and `error.metadata.param` the offending field. Upstream 400/422 become 400
          and 413 stays 413 (with the upstream message), 429 is 429 `rate_limited`, 401/402/403 and 5xx
          are 502 `backend_error` (503 stays 503), timeouts 504.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlphaDecisionsRequest"
            examples:
              support_ticket:
                summary: OpenRouter's example; `auto` serves text with the local Laya
                value:
                  model: auto
                  state:
                    customer_tier: enterprise
                    ticket: My checkout page shows a blank screen after I click Pay. I have tried two browsers.
                  questions:
                    is_bug:
                      type: noul
                      instructions: Is the customer reporting a software defect?
                      criteria:
                        "true": The customer describes broken or unexpected product behavior.
                        "false": The customer is asking a question or requesting a feature.
                    team:
                      type: choice
                      instructions: Which team should own this ticket?
                      criteria:
                        account: Login, permissions, or profile issues.
                        frontend: Rendering, layout, or browser compatibility issues.
                        payments: Checkout, billing, or payment processing issues.
                    urgency:
                      type: score
                      instructions: How urgent is this ticket?
                      criteria:
                        - Can wait for the next release
                        - Should be fixed this week
                        - Blocking revenue right now
              receipt_image:
                summary: An image asset and a box question; served by the paid model behind `auto`
                value:
                  model: auto
                  state: [receipt]
                  questions:
                    paid:
                      type: noul
                      instructions: Is the receipt marked as paid?
                    total:
                      type: box
                      instructions: The total amount on the receipt.
                  assets:
                    receipt: {format: png, data_base64: "iVBORw0KGgoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=="}
      responses:
        "200":
          description: One typed answer per question id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlphaDecisionsResponse"
              examples:
                local:
                  summary: Served by the local Laya
                  value:
                    model: laya-english
                    answers:
                      is_bug: {type: noul, noul: 0.8184}
                      team:
                        type: choice
                        choice: payments
                        probabilities: {account: 0.008, frontend: 0.0053, payments: 0.9867}
                        confidence: 0.9141
                      urgency:
                        type: score
                        score: 1.4386
                        probabilities: {"0": 0.104, "1": 0.3535, "2": 0.5426}
                        legend: {"0": Can wait for the next release, "1": Should be fixed this week, "2": Blocking revenue right now}
                        confidence: 0.1492
                    usage: {input_tokens: 249, output_tokens: 0, cost: 0}
                    id: gen-dec-1793990400-Xk3d9QpL2mZr7TfB1wYc
                    provider: homelab
                openrouter:
                  summary: Forwarded to OpenRouter (registry id jev)
                  value:
                    model: jev
                    answers:
                      paid: {type: noul, noul: 0.96}
                      total:
                        type: box
                        box: {top: 0.72, bottom: 0.78, left: 0.55, right: 0.9}
                        confidence: 0.88
                    usage: {cost: 0.000019992, input_tokens: 476, output_tokens: 70}
                    id: gen-dec-1789738314-X5e5eKGQdvR9rblyX250
                    provider: TypeSafe
        "400": {$ref: "#/components/responses/AlphaInvalidRequest"}
        "401": {$ref: "#/components/responses/AlphaUnauthorized"}
        "403": {$ref: "#/components/responses/AlphaForbidden"}
        "413": {$ref: "#/components/responses/AlphaPayloadTooLarge"}
        "429": {$ref: "#/components/responses/AlphaRateLimited"}
        "500": {$ref: "#/components/responses/AlphaError"}
        "502": {$ref: "#/components/responses/AlphaError"}
        "503": {$ref: "#/components/responses/AlphaError"}
        "504": {$ref: "#/components/responses/AlphaError"}
  /v1/health:
    get:
      tags: [ops]
      operationId: health
      summary: Liveness and backend readiness (public).
      description: |
        KServe V2-style readiness rolled up across backends. `ok` when every backend is ok,
        `degraded` when at least one (but not all) is down, `down` when none is usable.
        Returns 200 for `ok` and `degraded`, 503 for `down`. No authentication.
        Every distinct local backend in the registry is probed once. `backends.text` and `backends.image`
        report the backends of the default models; `models` reports the backend status of every
        local model by id. Paid OpenRouter models are not probed and do not affect `status`; they are
        listed under `upstreams`.
      security: []
      responses:
        "200":
          description: Service is serving at least one backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    backends:
                      text: {status: ok, latency_ms: 3}
                      image: {status: ok, latency_ms: 2}
                    models:
                      laya-english: {status: ok, latency_ms: 3}
                      laya-multilingual: {status: ok, latency_ms: 3}
                      laya-typed-decisions: {status: ok, latency_ms: 3}
                      siglip2-base-patch16-224: {status: ok, latency_ms: 2}
        "503":
          description: No backend is usable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                down:
                  value:
                    status: down
                    backends:
                      text: {status: down}
                      image: {status: down}
                    models:
                      laya-english: {status: down}
                      laya-multilingual: {status: down}
                      laya-typed-decisions: {status: down}
                      siglip2-base-patch16-224: {status: down}
  /healthz:
    get:
      tags: [ops]
      operationId: liveness
      summary: Process liveness (public, for Kubernetes probes).
      description: |
        Answers 200 as long as the proxy process is serving HTTP. It calls no backend and needs
        no authentication; use `GET /v1/health` for backend readiness.
      security: []
      responses:
        "200":
          description: The proxy is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
              examples:
                ok:
                  value: {status: ok}
  /v1/models:
    get:
      tags: [ops]
      operationId: listModels
      summary: List served models (KServe V2-style model repository listing).
      description: |
        Every registry model with its task, backend, capabilities and whether it is `paid` (served by
        OpenRouter, only for keys with paid access). Models with task `decisions` and every alias are
        reachable only through `POST /api/alpha/decisions`. `aliases` lists the registry aliases: `text`
        is the model used for text-only requests, `image` the one used when a request has media parts,
        `assets` or box questions (the same id twice for a single-target alias).
      responses:
        "200":
          description: Served models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
              examples:
                current:
                  summary: Built from api/fixtures/laya-models.json plus the pinned SigLIP2 commit
                  value:
                    models:
                      - {id: laya-english, task: text-decision, backend: laya, version: laya-serve-0.4.20, capabilities: [text], paid: false}
                      - {id: laya-multilingual, task: text-decision, backend: laya, version: laya-serve-0.4.20, capabilities: [text], paid: false}
                      - {id: laya-typed-decisions, task: text-decision, backend: laya, version: laya-serve-0.4.20, capabilities: [text], paid: false}
                      - {id: siglip2-base-patch16-224, task: image-zero-shot, backend: siglip2, version: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2, capabilities: [image], paid: false}
                    aliases: []
                example_registry:
                  summary: services/proxy/registry.example.yaml (adds the paid OpenRouter model jev and the alias auto)
                  value:
                    models:
                      - {id: laya-english, task: text-decision, backend: laya, version: laya-serve-0.4.20, capabilities: [text], paid: false}
                      - {id: laya-multilingual, task: text-decision, backend: laya, version: laya-serve-0.4.20, capabilities: [text], paid: false}
                      - {id: laya-typed-decisions, task: text-decision, backend: laya, version: laya-serve-0.4.20, capabilities: [text], paid: false}
                      - {id: siglip2-base-patch16-224, task: image-zero-shot, backend: siglip2, version: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2, capabilities: [image], paid: false}
                      - {id: jev, task: decisions, backend: openrouter, version: jev-1.14, capabilities: [text, image, box], paid: true, backend_model: typesafe/jev-1.14}
                    aliases:
                      - {id: auto, text: laya-english, image: jev}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        API key sent as `Authorization: Bearer <key>`. Keys issued in the admin page
        (`admin-api.yaml`) have the form `dk_<public_id>_<secret>`. The legacy key imported from
        SOPS, and the break-glass keys in the proxy's key file, keep their original form.
        Expired and revoked keys are rejected like unknown keys.
  responses:
    AlphaInvalidRequest:
      description: "`invalid_request` (OpenRouter envelope) - schema violation, unknown model, unused asset, or a capability the model lacks."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AlphaErrorEnvelope"}
          examples:
            example:
              value:
                error: {code: 400, message: "model 'laya-english' does not accept images", metadata: {code: invalid_request, param: model}}
    AlphaUnauthorized:
      description: "`unauthorized` (OpenRouter envelope) - missing, unknown, expired or revoked bearer key."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AlphaErrorEnvelope"}
          examples:
            example:
              value:
                error: {code: 401, message: "missing or invalid API key", metadata: {code: unauthorized, param: null}}
    AlphaForbidden:
      description: "`forbidden` - the key is not allowed to use paid models."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AlphaErrorEnvelope"}
          examples:
            example:
              value:
                error: {code: 403, message: "this API key is not allowed to use paid model 'jev'; ask the owner to enable paid models for it", metadata: {code: forbidden, param: model}}
    AlphaPayloadTooLarge:
      description: "`payload_too_large` - body over 16 MiB, or a local model's 32 KiB state or 8 MiB image limit."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AlphaErrorEnvelope"}
          examples:
            example:
              value:
                error: {code: 413, message: "request body exceeds 16777216 bytes", metadata: {code: payload_too_large, param: null}}
    AlphaRateLimited:
      description: "`rate_limited` - OpenRouter rate-limited the request."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AlphaErrorEnvelope"}
          examples:
            example:
              value:
                error: {code: 429, message: "upstream rate limit reached; retry later", metadata: {code: rate_limited, param: null}}
    AlphaError:
      description: "`internal_error` (500), `backend_error` (502), `backend_unavailable` (503), `backend_timeout` (504)."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AlphaErrorEnvelope"}
          examples:
            example:
              value:
                error: {code: 502, message: "upstream rejected the request (credentials or credits)", metadata: {code: backend_error, param: null}}
    InvalidRequest:
      description: "`invalid_request` - malformed body, schema violation, unknown model pin, or a count limit exceeded."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          example:
            error: {code: invalid_request, message: "questions: at most 32 questions are allowed"}
    Unauthorized:
      description: |
        `unauthorized` - missing, malformed, unknown, expired or revoked bearer key. All cases return
        the same generic message.
      headers:
        WWW-Authenticate:
          schema: {type: string, example: Bearer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          example:
            error: {code: unauthorized, message: missing or invalid API key}
    PayloadTooLarge:
      description: "`payload_too_large` - text state over 32 KiB or decoded image over 8 MiB."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          example:
            error: {code: payload_too_large, message: decoded image is 9437184 bytes; limit is 8388608}
    InternalError:
      description: "`internal_error` - unexpected failure inside the proxy."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          example:
            error: {code: internal_error, message: unexpected error}
    BackendError:
      description: "`backend_error` - the backend answered with an error or an unparseable response."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          example:
            model: laya-english
            latency_ms: 41
            error: {code: backend_error, message: "laya returned HTTP 500"}
    BackendUnavailable:
      description: "`backend_unavailable` - the backend is not reachable or not loaded."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          example:
            error: {code: backend_unavailable, message: "text backend unreachable at 127.0.0.1:8000"}
    BackendTimeout:
      description: "`backend_timeout` - the backend did not answer within the proxy timeout."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          example:
            error: {code: backend_timeout, message: image backend did not answer within 30000 ms}
  schemas:
    # ---------- envelope ----------
    Envelope:
      type: object
      description: Common success wrapper. `results` is task-specific.
      required: [model, model_version, latency_ms, results]
      properties:
        model:
          type: string
          description: Served model id (see `GET /v1/models`).
        model_version:
          type: string
          description: Exact backend version (package version or model commit).
        latency_ms:
          type: number
          minimum: 0
          description: Wall time spent in the proxy for this request, in milliseconds.
        results:
          description: Task-specific results.
        meta:
          type: object
          description: Optional backend-specific details (routing, usage, device).
          additionalProperties: true
        error:
          $ref: "#/components/schemas/Error"
    ErrorEnvelope:
      type: object
      description: Failure wrapper. `model` fields are present only once a model was resolved.
      required: [error]
      properties:
        model: {type: string}
        model_version: {type: string}
        latency_ms: {type: number, minimum: 0}
        meta: {type: object, additionalProperties: true}
        error: {$ref: "#/components/schemas/Error"}
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [unauthorized, forbidden, invalid_request, payload_too_large, rate_limited, backend_unavailable, backend_timeout, backend_error, internal_error]
          description: |
            `unauthorized`=401, `forbidden`=403, `invalid_request`=400, `payload_too_large`=413,
            `rate_limited`=429, `backend_unavailable`=503, `backend_timeout`=504, `backend_error`=502,
            `internal_error`=500. `forbidden` and `rate_limited` occur only on `/api/alpha/decisions`.
        message:
          type: string
          description: Human-readable explanation. Never contains secrets.
        type:
          type: string
          enum: [invalid_request_error, authentication_error, permission_error, rate_limit_error, server_error]
          description: |
            OpenAI-style error class: `invalid_request_error` for 400 and 413, `authentication_error`
            for 401, `server_error` for 5xx.
        param:
          type: [string, "null"]
          description: The request field the error is about (e.g. `questions[0].choices`), or null.
    # ---------- text ----------
    TextDecisionRequest:
      type: object
      required: [state, questions]
      additionalProperties: false
      properties:
        state:
          description: |
            The thing to decide about: free text or a JSON object. Maximum 32 KiB (32768 bytes)
            serialized as UTF-8 JSON; larger states are rejected with 413.
          oneOf:
            - type: string
              minLength: 1
              maxLength: 32768
            - type: object
        questions:
          type: object
          description: Question id -> question. 1 to 32 questions.
          minProperties: 1
          maxProperties: 32
          propertyNames:
            pattern: "^[A-Za-z0-9_.-]{1,64}$"
          additionalProperties:
            $ref: "#/components/schemas/Question"
        model:
          type: string
          description: |
            Optional text model: a `text-decision` id from `GET /v1/models` (for example
            `laya-english`), or a Laya checkpoint name `english`, `multilingual`, `typed-decisions`
            (Laya aliases such as `en`, `multi`, `typed` are accepted), which selects `laya-<checkpoint>`.
            When omitted, the default text model serves the request and Laya routes automatically by
            script/language (see `meta.routing`). Unknown models, and models of another task, return 400.
          examples: [laya-english, english, multilingual, typed-decisions]
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Optional threshold. Answers whose `confidence` is below it are still returned but
            flagged with `low_confidence: true`.
    Question:
      oneOf:
        - $ref: "#/components/schemas/ChoiceQuestion"
        - $ref: "#/components/schemas/ScoreQuestion"
        - $ref: "#/components/schemas/NoulQuestion"
      discriminator:
        propertyName: type
        mapping:
          choice: "#/components/schemas/ChoiceQuestion"
          score: "#/components/schemas/ScoreQuestion"
          noul: "#/components/schemas/NoulQuestion"
    ChoiceQuestion:
      type: object
      description: Pick exactly one label.
      required: [type, instructions, criteria]
      properties:
        type: {const: choice}
        instructions: {type: string, minLength: 1, maxLength: 2048}
        criteria:
          type: object
          description: Label -> description of when to choose it.
          minProperties: 2
          maxProperties: 64
          additionalProperties: {type: string}
    ScoreQuestion:
      type: object
      description: Ordinal scale; levels are indexed 0..n-1 in the order given.
      required: [type, instructions, criteria]
      properties:
        type: {const: score}
        instructions: {type: string, minLength: 1, maxLength: 2048}
        criteria:
          type: array
          description: Level descriptions from lowest to highest.
          minItems: 2
          maxItems: 16
          items: {type: string}
    NoulQuestion:
      type: object
      description: Yes/no ("noul") question answered with a probability of "yes".
      required: [type, instructions]
      properties:
        type: {const: noul}
        instructions: {type: string, minLength: 1, maxLength: 2048}
    TextDecisionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            results:
              type: object
              description: Question id -> answer (same keys as the request `questions`).
              additionalProperties:
                $ref: "#/components/schemas/TextAnswer"
            meta:
              type: object
              properties:
                backend_model:
                  type: string
                  description: Laya's own `model` field (e.g. `laya-rl-agent`).
                usage: {$ref: "#/components/schemas/LayaUsage"}
                routing: {$ref: "#/components/schemas/LayaRouting"}
    TextAnswer:
      oneOf:
        - $ref: "#/components/schemas/ChoiceAnswer"
        - $ref: "#/components/schemas/ScoreAnswer"
        - $ref: "#/components/schemas/NoulAnswer"
      discriminator:
        propertyName: type
        mapping:
          choice: "#/components/schemas/ChoiceAnswer"
          score: "#/components/schemas/ScoreAnswer"
          noul: "#/components/schemas/NoulAnswer"
    AnswerCommon:
      type: object
      properties:
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Laya's calibrated confidence in the answer as a whole.
        answer_confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Probability mass of the selected answer (choice/score) or of the answered side (noul).
        action:
          type: object
          description: Laya action head output.
          properties:
            act_probability: {type: number, minimum: 0, maximum: 1}
        low_confidence:
          type: boolean
          description: Present only when `min_confidence` was sent; true when `confidence < min_confidence`.
    ChoiceAnswer:
      allOf:
        - $ref: "#/components/schemas/AnswerCommon"
        - type: object
          required: [type, choice, probabilities, confidence]
          properties:
            type: {const: choice}
            choice: {type: string, description: Selected label from `criteria`.}
            probabilities:
              type: object
              description: Label -> probability; sums to ~1.
              additionalProperties: {type: number, minimum: 0, maximum: 1}
    ScoreAnswer:
      allOf:
        - $ref: "#/components/schemas/AnswerCommon"
        - type: object
          required: [type, score, probabilities, confidence]
          properties:
            type: {const: score}
            score:
              type: number
              minimum: 0
              description: Expected level (probability-weighted mean of level indices, 0..n-1).
            legend:
              type: object
              description: Level index (as string) -> level description from `criteria`.
              additionalProperties: {type: string}
            probabilities:
              type: object
              description: Level index (as string) -> probability; sums to ~1.
              propertyNames: {pattern: "^[0-9]+$"}
              additionalProperties: {type: number, minimum: 0, maximum: 1}
    NoulAnswer:
      allOf:
        - $ref: "#/components/schemas/AnswerCommon"
        - type: object
          required: [type, noul]
          properties:
            type: {const: noul}
            noul:
              type: number
              minimum: 0
              maximum: 1
              description: Probability that the answer is "yes".
    LayaUsage:
      type: object
      description: Passed through from Laya `usage`.
      properties:
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        state_tokens: {type: integer, minimum: 0}
        state_tokens_dropped: {type: integer, minimum: 0}
        truncated: {type: boolean}
        truncated_questions:
          type: array
          items: {type: string}
    LayaRouting:
      type: object
      description: |
        Passed through from Laya `routing` (which checkpoint served the request and why).
        The proxy removes `repo` (a local filesystem path).
      properties:
        model: {type: string, description: "Checkpoint actually used: english, multilingual, typed-decisions."}
        reason: {type: string}
        detection:
          type: object
          additionalProperties: true
          properties:
            script: {type: string}
            script_profile:
              type: object
              additionalProperties: {type: number}
            language: {type: [string, "null"]}
            is_english: {type: boolean}
            language_undecided: {type: boolean}
            diacritic_rate: {type: number}
            non_latin_fraction: {type: number}
            mixed_segment: {}
        workflow: {}
    # ---------- image ----------
    ImageClassifyRequest:
      type: object
      required: [image, candidate_labels]
      additionalProperties: false
      properties:
        image:
          type: object
          required: [base64]
          additionalProperties: false
          properties:
            base64:
              type: string
              contentEncoding: base64
              minLength: 4
              maxLength: 11184812
              description: |
                Standard base64 (no data: URL prefix) of the image bytes. Max 8 MiB (8388608 bytes)
                after decoding, i.e. at most 11184812 base64 characters; larger images return 413.
            media_type:
              type: string
              enum: [image/jpeg, image/png]
              description: Optional hint; the proxy sniffs the bytes when omitted.
        candidate_labels:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 256}
        hypothesis_template:
          type: string
          default: a photo of a {}
          pattern: "\\{\\}"
          maxLength: 512
          description: Prompt template; `{}` is replaced by each candidate label.
        top_k:
          type: integer
          minimum: 1
          maximum: 64
          description: Return only the top k labels. Default is all candidate labels.
        pad_to_square:
          type: boolean
          default: false
          description: >-
            Pad (not crop) the image onto a white square before resizing to 224x224. Padding keeps the
            aspect ratio, but it spreads probability on tall document images such as receipts, so it is
            off by default. Turn it on for images where squashing distorts the subject.
        model:
          type: string
          description: |
            Optional `image-zero-shot` model id from `GET /v1/models`. When omitted, the default image
            model serves the request. Unknown models, and models of another task, return 400.
          examples: [siglip2-base-patch16-224]
    ImageClassifyEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            results:
              type: array
              description: Sorted by descending `score`.
              items:
                $ref: "#/components/schemas/LabelScore"
    LabelScore:
      type: object
      required: [label, score]
      properties:
        label: {type: string}
        score: {type: number, minimum: 0, maximum: 1}
    # ---------- decisions (OpenAI wire format) ----------
    DecisionCreateRequest:
      type: object
      required: [input, questions]
      additionalProperties: false
      properties:
        model:
          type: string
          minLength: 1
          description: "`gpt-6-luna` (the default model), a registry id, or a Laya checkpoint name."
          examples: [gpt-6-luna, laya-english, siglip2-base-patch16-224]
        input:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
              items: {$ref: "#/components/schemas/DecisionInputItem"}
        questions:
          type: array
          minItems: 1
          maxItems: 400
          items: {$ref: "#/components/schemas/DecisionQuestion"}
        prompt_cache_key: {type: [string, "null"], description: Accepted and ignored.}
        prompt_cache_options: {type: [object, "null"], description: Accepted and ignored.}
        safety_identifier: {type: [string, "null"], description: Accepted and ignored.}
    DecisionInputItem:
      oneOf:
        - $ref: "#/components/schemas/DecisionMessage"
        - $ref: "#/components/schemas/DecisionToolCall"
        - $ref: "#/components/schemas/DecisionToolCallOutput"
    DecisionMessage:
      type: object
      required: [role, content]
      description: |
        `user` content may hold input_text, input_image and input_json parts; `developer` and `system`
        (treated as developer) only input_text; `assistant` only output_text and refusal.
      properties:
        type: {const: message}
        role: {enum: [user, developer, system, assistant]}
        phase: {enum: [commentary, final_answer, null]}
        content:
          oneOf:
            - type: string
            - type: array
              items: {$ref: "#/components/schemas/DecisionContentPart"}
    DecisionToolCall:
      type: object
      required: [type, call_id, name]
      properties:
        type: {enum: [function_call, custom_tool_call]}
        call_id: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1}
        arguments: {type: string, description: "function_call only."}
        input: {type: string, description: "custom_tool_call only."}
    DecisionToolCallOutput:
      type: object
      required: [type, call_id, output]
      properties:
        type: {enum: [function_call_output, custom_tool_call_output]}
        call_id: {type: string, minLength: 1, maxLength: 64, description: Must match an earlier call.}
        output:
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - $ref: "#/components/schemas/DecisionInputText"
                  - $ref: "#/components/schemas/DecisionInputImage"
    DecisionContentPart:
      oneOf:
        - $ref: "#/components/schemas/DecisionInputText"
        - $ref: "#/components/schemas/DecisionInputImage"
        - $ref: "#/components/schemas/DecisionInputJSON"
        - type: object
          required: [type, text]
          properties:
            type: {const: output_text}
            text: {type: string}
        - type: object
          required: [type, refusal]
          properties:
            type: {const: refusal}
            refusal: {type: string}
    DecisionInputText:
      type: object
      required: [type, text]
      properties:
        type: {const: input_text}
        text: {type: string}
        prompt_cache_breakpoint: {description: Accepted and ignored.}
    DecisionInputImage:
      type: object
      required: [type, image_url]
      properties:
        type: {const: input_image}
        image_url:
          type: string
          pattern: "^data:image/(png|jpeg|jpg);base64,"
          description: Base64 data URL of a PNG or JPEG image. Hosted http(s) URLs are rejected with 400.
        detail: {description: Accepted and ignored.}
        prompt_cache_breakpoint: {description: Accepted and ignored.}
    DecisionInputJSON:
      type: object
      required: [type, data]
      properties:
        type: {const: input_json}
        data:
          oneOf:
            - type: object
            - type: array
              items: {type: object}
    DecisionInstructions:
      description: A string, or text and JSON parts joined with newlines (image parts return 400).
      oneOf:
        - type: string
          minLength: 1
          maxLength: 2048
        - type: array
          minItems: 1
          items:
            oneOf:
              - $ref: "#/components/schemas/DecisionInputText"
              - $ref: "#/components/schemas/DecisionInputJSON"
    DecisionQuestion:
      oneOf:
        - $ref: "#/components/schemas/PredicateDecisionQuestion"
        - $ref: "#/components/schemas/ChoiceDecisionQuestion"
        - $ref: "#/components/schemas/ScoreDecisionQuestion"
      discriminator:
        propertyName: type
        mapping:
          predicate: "#/components/schemas/PredicateDecisionQuestion"
          choice: "#/components/schemas/ChoiceDecisionQuestion"
          score: "#/components/schemas/ScoreDecisionQuestion"
    PredicateDecisionQuestion:
      type: object
      description: Probability that a statement about the input is true (Laya `noul`).
      required: [type, instructions]
      additionalProperties: false
      properties:
        type: {const: predicate}
        name: {type: string}
        instructions: {$ref: "#/components/schemas/DecisionInstructions"}
    ChoiceDecisionQuestion:
      type: object
      required: [type, instructions, choices]
      additionalProperties: false
      properties:
        type: {const: choice}
        name: {type: string}
        instructions: {$ref: "#/components/schemas/DecisionInstructions"}
        choices:
          type: array
          minItems: 2
          maxItems: 64
          items:
            type: object
            required: [value]
            additionalProperties: false
            properties:
              value: {type: [string, boolean]}
              description: {type: string}
    ScoreDecisionQuestion:
      type: object
      required: [type, instructions, levels]
      additionalProperties: false
      properties:
        type: {const: score}
        name: {type: string}
        instructions: {$ref: "#/components/schemas/DecisionInstructions"}
        levels:
          type: array
          description: Ordered from lowest to highest; level indices start at 0.
          minItems: 2
          maxItems: 10
          items:
            type: object
            required: [label]
            additionalProperties: false
            properties:
              label: {type: string}
              description: {type: string}
    Decision:
      type: object
      required: [model, answers, usage]
      properties:
        model:
          type: string
          description: Served model id (see `GET /v1/models`).
        answers:
          type: array
          description: One answer per question, in question order.
          items:
            oneOf:
              - $ref: "#/components/schemas/PredicateDecisionAnswer"
              - $ref: "#/components/schemas/ChoiceDecisionAnswer"
              - $ref: "#/components/schemas/ScoreDecisionAnswer"
              - $ref: "#/components/schemas/RefusalDecisionAnswer"
        usage: {$ref: "#/components/schemas/DecisionUsage"}
    PredicateDecisionAnswer:
      type: object
      required: [type, name, probability]
      properties:
        type: {const: predicate}
        name: {type: [string, "null"]}
        probability: {type: number, minimum: 0, maximum: 1}
    ChoiceDecisionAnswer:
      type: object
      required: [type, name, choice, probabilities, confidence]
      properties:
        type: {const: choice}
        name: {type: [string, "null"]}
        choice: {type: [string, boolean]}
        probabilities:
          type: array
          description: In the order of the question's choices.
          items:
            type: object
            required: [value, probability]
            properties:
              value: {type: [string, boolean]}
              probability: {type: number, minimum: 0, maximum: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
    ScoreDecisionAnswer:
      type: object
      required: [type, name, score, probabilities, confidence]
      properties:
        type: {const: score}
        name: {type: [string, "null"]}
        score: {type: number, minimum: 0, description: Probability-weighted mean of the level indices.}
        probabilities:
          type: array
          items:
            type: object
            required: [value, label, probability]
            properties:
              value: {type: integer, minimum: 0}
              label: {type: string}
              probability: {type: number, minimum: 0, maximum: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
    RefusalDecisionAnswer:
      type: object
      required: [type, name]
      properties:
        type: {const: refusal}
        name: {type: [string, "null"]}
    DecisionUsage:
      type: object
      required: [input_tokens, input_tokens_details, output_tokens, output_tokens_details, total_tokens]
      properties:
        input_tokens: {type: integer, minimum: 0}
        input_tokens_details:
          type: object
          required: [cached_tokens, cache_write_tokens]
          properties:
            cached_tokens: {const: 0}
            cache_write_tokens: {const: 0}
        output_tokens: {type: integer, minimum: 0}
        output_tokens_details:
          type: object
          required: [reasoning_tokens]
          properties:
            reasoning_tokens: {const: 0}
        total_tokens: {type: integer, minimum: 0}
    # ---------- ops ----------
    BackendHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        latency_ms:
          type: number
          minimum: 0
          description: Round-trip time of the backend health probe.
    HealthResponse:
      type: object
      required: [status, backends]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        backends:
          type: object
          required: [text, image]
          description: Backends of the default text and image models.
          properties:
            text: {$ref: "#/components/schemas/BackendHealth"}
            image: {$ref: "#/components/schemas/BackendHealth"}
        models:
          type: object
          description: Model id -> status of the backend serving it (every local model in `GET /v1/models`).
          additionalProperties: {$ref: "#/components/schemas/BackendHealth"}
        upstreams:
          type: object
          description: |
            Paid OpenRouter models (present only when the registry has some). They are never probed
            (OpenRouter has no health endpoint) and never change `status`; `configured` is false when
            the proxy has no OpenRouter key, in which case requests for them get 503.
          additionalProperties:
            type: object
            required: [status, configured]
            additionalProperties: false
            properties:
              status: {const: not_probed}
              configured: {type: boolean}
    Liveness:
      type: object
      required: [status]
      properties:
        status: {type: string, const: ok}
    Model:
      type: object
      required: [id, task, backend, version, capabilities, paid]
      properties:
        id: {type: string}
        task:
          type: string
          enum: [text-decision, image-zero-shot, decisions]
          description: "`decisions`: an OpenRouter model, served only by `POST /api/alpha/decisions`."
        capabilities:
          type: array
          description: What the model accepts in `POST /api/alpha/decisions` (box = box questions).
          items: {type: string, enum: [text, image, box, audio, video]}
        paid:
          type: boolean
          description: Served by OpenRouter at a cost; only API keys with paid access may use it.
        backend_model:
          type: string
          description: The upstream OpenRouter model id (paid models only).
        backend:
          type: string
          description: Backend kind (the registry entry's label, by default its adapter).
          examples: [laya, siglip2, zero-shot-image]
        version:
          type: string
          description: Backend package version or pinned model commit.
    ModelList:
      type: object
      required: [models, aliases]
      properties:
        models:
          type: array
          items: {$ref: "#/components/schemas/Model"}
        aliases:
          type: array
          description: Registry aliases (POST /api/alpha/decisions only).
          items: {$ref: "#/components/schemas/ModelAlias"}
    ModelAlias:
      type: object
      required: [id, text, image]
      additionalProperties: false
      properties:
        id: {type: string}
        text: {type: string, description: Model id serving text-only requests.}
        image: {type: string, description: Model id serving requests with media, assets or box questions.}
    # ---------- /api/alpha/decisions (OpenRouter wire format) ----------
    AlphaGuidance:
      type: [string, object, array]
      description: A plain string, or a JSON object or array of structured guidance.
    AlphaNullableGuidance:
      type: [string, object, array, "null"]
    AlphaDecisionsRequest:
      type: object
      required: [model, state, questions]
      additionalProperties: false
      properties:
        model: {type: string, minLength: 1, description: "A registry model id or alias (GET /v1/models), or a Laya checkpoint name."}
        state:
          type: [string, object, array]
          description: The content to evaluate. Media go in as `image_url` / `input_audio` / `video_url` parts.
        questions:
          type: object
          minProperties: 1
          maxProperties: 400
          propertyNames: {pattern: "^[A-Za-z0-9_.-]{1,64}$"}
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/AlphaNoulQuestion"
              - $ref: "#/components/schemas/AlphaChoiceQuestion"
              - $ref: "#/components/schemas/AlphaScoreQuestion"
              - $ref: "#/components/schemas/AlphaBoxQuestion"
        assets:
          type: object
          description: Images keyed by reference; every key must appear in state, instructions or criteria.
          propertyNames: {minLength: 1, maxLength: 256}
          additionalProperties: {$ref: "#/components/schemas/AlphaImageAsset"}
        provider:
          type: [object, "null"]
          description: OpenRouter provider preferences; forwarded to OpenRouter, ignored by local models.
        session_id: {type: string, maxLength: 256, description: Accepted; never forwarded.}
        trace: {type: object, description: Accepted; never forwarded.}
        user: {type: string, maxLength: 256, description: Accepted; never forwarded.}
    AlphaNoulQuestion:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: {const: noul}
        instructions: {$ref: "#/components/schemas/AlphaNullableGuidance"}
        criteria:
          type: object
          additionalProperties: false
          properties:
            "true": {$ref: "#/components/schemas/AlphaNullableGuidance"}
            "false": {$ref: "#/components/schemas/AlphaNullableGuidance"}
    AlphaChoiceQuestion:
      type: object
      required: [type, criteria]
      additionalProperties: false
      properties:
        type: {const: choice}
        instructions: {$ref: "#/components/schemas/AlphaNullableGuidance"}
        criteria:
          type: object
          minProperties: 1
          additionalProperties: {$ref: "#/components/schemas/AlphaNullableGuidance"}
    AlphaScoreQuestion:
      type: object
      required: [type, criteria]
      additionalProperties: false
      properties:
        type: {const: score}
        instructions: {$ref: "#/components/schemas/AlphaNullableGuidance"}
        criteria:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/AlphaGuidance"}
    AlphaBoxQuestion:
      type: object
      required: [type, instructions]
      additionalProperties: false
      properties:
        type: {const: box}
        instructions: {$ref: "#/components/schemas/AlphaGuidance"}
    AlphaImageAsset:
      type: object
      required: [format, data_base64]
      additionalProperties: false
      properties:
        type: {const: image}
        format: {type: string, enum: [png, jpg, jpeg]}
        data_base64:
          type: string
          minLength: 1
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
    AlphaDecisionsResponse:
      type: object
      required: [model, answers, usage, id, provider]
      properties:
        model: {type: string, description: The registry id that served the request.}
        answers:
          type: object
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/AlphaNoulAnswer"
              - $ref: "#/components/schemas/AlphaChoiceAnswer"
              - $ref: "#/components/schemas/AlphaScoreAnswer"
              - $ref: "#/components/schemas/AlphaBoxAnswer"
              - $ref: "#/components/schemas/AlphaRefusalAnswer"
        usage:
          type: object
          required: [input_tokens, output_tokens]
          properties:
            input_tokens: {type: integer, minimum: 0}
            output_tokens: {type: integer, minimum: 0}
            cost: {type: number, minimum: 0, description: OpenRouter's cost in USD credits; 0 for local models.}
        id: {type: string}
        provider: {type: string, description: "`homelab` for local models, else OpenRouter's provider name."}
        annotations:
          type: array
          description: Passed through from OpenRouter when present.
          items: {type: object}
    AlphaNoulAnswer:
      type: object
      required: [type, noul]
      properties:
        type: {const: noul}
        noul: {type: number, minimum: 0, maximum: 1}
    AlphaChoiceAnswer:
      type: object
      required: [type, choice]
      properties:
        type: {const: choice}
        choice: {type: string}
        probabilities: {type: object, additionalProperties: {type: number}}
        confidence: {type: number}
    AlphaScoreAnswer:
      type: object
      required: [type, score]
      properties:
        type: {const: score}
        score: {type: number}
        probabilities: {type: object, additionalProperties: {type: number}}
        legend:
          type: object
          description: Level index -> the criterion as the client sent it.
          additionalProperties: {$ref: "#/components/schemas/AlphaGuidance"}
        confidence: {type: number}
    AlphaBoxAnswer:
      type: object
      required: [type, box]
      properties:
        type: {const: box}
        box:
          type: object
          required: [top, bottom, left, right]
          properties:
            top: {type: number}
            bottom: {type: number}
            left: {type: number}
            right: {type: number}
        confidence: {type: number}
    AlphaRefusalAnswer:
      type: object
      required: [type]
      properties:
        type: {const: refusal}
    AlphaErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      description: OpenRouter's error shape, used on `/api/alpha/*` (including 401 and 413).
      properties:
        error:
          type: object
          required: [code, message, metadata]
          additionalProperties: false
          properties:
            code: {type: integer, description: The HTTP status.}
            message: {type: string}
            metadata: {$ref: "#/components/schemas/AlphaErrorMetadata"}
    AlphaErrorMetadata:
      type: object
      required: [code, param]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [unauthorized, forbidden, invalid_request, payload_too_large, rate_limited, backend_unavailable, backend_timeout, backend_error, internal_error]
          description: The contract error code (see the table in the description).
        param: {type: [string, "null"], description: The offending request field, or null.}
